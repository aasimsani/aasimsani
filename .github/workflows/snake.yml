name: Generate Snake Animation

on:
  schedule:
    # daily at 02:30 UTC — off the hour so it does not race the hourly
    # Goodreads job, which also pushes to main
    - cron: "30 2 * * *"
  workflow_dispatch: # manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Render After-hours snake
        run: python3 scripts/afterhours_snake.py ${{ github.repository_owner }} dist/afterhours-snake.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update date range in README
        run: |
          END_DATE=$(date +"%b %Y")
          START_DATE=$(date -d "1 year ago" +"%b %Y" 2>/dev/null || date -v-1y +"%b %Y")
          # perl -0 slurps the file: the marker block spans multiple lines, so a
          # line-based sed never matches it.
          perl -0pi -e "s|<!-- SNAKE_DATES:START -->.*?<!-- SNAKE_DATES:END -->|<!-- SNAKE_DATES:START --><sub>${START_DATE} – ${END_DATE}</sub><!-- SNAKE_DATES:END -->|s" README.md
          grep -q "SNAKE_DATES:START --><sub>${START_DATE}" README.md || {
            echo "::error::SNAKE_DATES markers not found in README.md"
            exit 1
          }

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add dist/ README.md
          if git commit -m "chore: update snake animation"; then
            git pull --rebase
            git push
          fi
