name: Update Goodreads Reading List

on:
  schedule:
    - cron: "0 * * * *" # every hour
  workflow_dispatch: # manual trigger

permissions:
  contents: write

jobs:
  update-reading-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Currently Reading
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: "GOODREADS"
          feed_list: "https://www.goodreads.com/review/list_rss/67959119?shelf=currently-reading"
          max_post_count: 5

      - name: Recently Read
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: "GOODREADS_READ"
          # order=d makes Goodreads return the feed sorted by date read, and
          # disable_sort keeps that order. The action's own sort uses pubDate,
          # which is when the review row was last touched, not when it was read.
          feed_list: "https://www.goodreads.com/review/list_rss/67959119?shelf=read&sort=date_read&order=d"
          disable_sort: true
          max_post_count: 5
